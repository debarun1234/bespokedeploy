name = "bespokedeploy"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

# ── D1 Database ──────────────────────────────────────────────────────────────
# Create with: wrangler d1 create bespokedeploy-db
# Then replace database_id below with the output ID
[[d1_databases]]
binding = "DB"
database_name = "bespokedeploy-db"
database_id   = "f8735a90-d742-4ef8-ba65-2fba164ff18d"

# ── Email ────────────────────────────────────────────────────────────────────
# Cloudflare send_email is not supported in Pages projects.
# Email notifications are handled via Razorpay's built-in email/SMS on payment links.
# WhatsApp notifications use Meta Cloud API (WA_ACCESS_TOKEN + WA_PHONE_NUMBER_ID secrets).

# ── Secrets (set via: wrangler pages secret put NAME --project-name=bespokedeploy) ──
# ADMIN_PASSWORD        — your admin panel password
# ADMIN_TOKEN_SECRET    — random 32-char string for signing auth tokens
# RAZORPAY_KEY_ID       — rzp_live_...
# RAZORPAY_KEY_SECRET   — your Razorpay secret key
# RAZORPAY_WEBHOOK_SECRET — from Razorpay dashboard → Webhooks
# WA_PHONE_NUMBER_ID    — Meta WhatsApp Cloud API phone number ID
# WA_ACCESS_TOKEN       — Meta WhatsApp Cloud API permanent token
# WA_OTP_TEMPLATE_NAME  — optional, defaults to "otp_verification". Only used if
#                         sendWhatsappOtp() in _shared/otp.js is switched back on —
#                         currently the OTP gate emails the code instead (see below),
#                         since Meta gates Authentication template creation behind a
#                         messaging-volume threshold this account hasn't reached yet.
# RESEND_API_KEY        — Resend API key (also powers phone OTP verification —
#                         the code is emailed to the customer's address, keyed to
#                         their phone number; no SMS provider, no DLT registration)
# RESEND_FROM           — e.g. "BespokeDeploy <noreply@bespokedeploy.in>" (domain
#                         must be verified in Resend)
