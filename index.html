    <!-- FAQ structured data — matches the on-page FAQ section, lets Google
         show these as rich Q&A results for long-tail searches -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I choose the right plan?",
          "acceptedAnswer": { "@type": "Answer", "text": "Portfolio suits individuals and students, Small Website suits local businesses and professionals, and Pro Website suits growing businesses that need more pages and functionality. Use the \"Help me pick\" quiz above the plans if you're unsure, or message me directly via the contact bubble." }
        },
        {
          "@type": "Question",
          "name": "What happens right after I pay the advance?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your slot is locked in immediately. I'll reach out within 24 hours by call or WhatsApp to discuss your content, structure, and any references you have in mind." }
        },
        {
          "@type": "Question",
          "name": "Can I switch plans or add features after booking?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — just let me know during our first conversation and I'll adjust your quote and balance accordingly before any build work starts." }
        },
        {
          "@type": "Question",
          "name": "How much does a custom website cost in India?",
          "acceptedAnswer": { "@type": "Answer", "text": "Custom websites here start at ₹{{PRICE_PORTFOLIO}} for a portfolio site, ₹{{PRICE_STARTER}} for a small business website, and ₹{{PRICE_PRO}} for a full-featured Pro site — all one-time payments with hosting included free, forever. No hidden fees or recurring charges." }
        },
        {
          "@type": "Question",
          "name": "Should I hire a freelancer or an agency for my website?",
          "acceptedAnswer": { "@type": "Answer", "text": "For most small businesses, professionals, and students, a solo freelancer offers better value — you work directly with the person building your site (no account managers or handoffs), pricing is more transparent, and turnaround is faster since there's no internal approval chain to wait on." }
        },
        {
          "@type": "Question",
          "name": "Do you build websites for clinics, dieticians, or local service businesses?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — recent projects include a nutrition and dietician counseling website (Sheetal's Prakritik Nutrition) and a wound care service website (Wound Care by Axcess). I regularly build for healthcare, wellness, and local service businesses alongside portfolios and general small-business sites." }
        },
        {
          "@type": "Question",
          "name": "How long does a project take?",
          "acceptedAnswer": { "@type": "Answer", "text": "Most projects are built within 5-7 days of our first content discussion, depending on plan complexity and how quickly you share content and feedback." }
        },
        {
          "@type": "Question",
          "name": "What do I need to provide?",
          "acceptedAnswer": { "@type": "Answer", "text": "Your business/profile content, any images or logos you have, and references to sites or styles you like. The more ready this is upfront, the faster we move." }
        },
        {
          "@type": "Question",
          "name": "Can I see progress before it's finished?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes — I share regular previews during the build phase so you can give feedback before the final version is locked in." }
        },
        {
          "@type": "Question",
          "name": "What if I go quiet for a while during the build?",
          "acceptedAnswer": { "@type": "Answer", "text": "That's fine for short gaps, but if there's no response from you for 14+ consecutive days the project may be treated as abandoned under our Terms, with the advance forfeited as a result." }
        },
        {
          "@type": "Question",
          "name": "What happens after final payment?",
          "acceptedAnswer": { "@type": "Answer", "text": "You get a 7-day review window with 2 free rounds of revisions included. Reply to the confirmation email with any change requests and I'll turn them around within 48 hours." }
        },
        {
          "@type": "Question",
          "name": "What if I need more than 2 revision rounds?",
          "acceptedAnswer": { "@type": "Answer", "text": "Additional rounds after the first 2 free ones are ₹500 each." }
        },
        {
          "@type": "Question",
          "name": "Do I own the final website?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, full ownership and files transfer to you once final payment is complete and the project is marked done." }
        },
        {
          "@type": "Question",
          "name": "What if something breaks after delivery?",
          "acceptedAnswer": { "@type": "Answer", "text": "Message me via the contact bubble or reply to any project email — I'll help sort it out. Ongoing maintenance beyond the free revision window can be arranged separately." }
        },
        {
          "@type": "Question",
          "name": "How much is the advance payment?",
          "acceptedAnswer": { "@type": "Answer", "text": "Typically 20-30% of the total project cost depending on the plan, paid upfront to lock your slot. The remaining balance is due only after you're satisfied with the final site." }
        },
        {
          "@type": "Question",
          "name": "What if I cancel before final payment?",
          "acceptedAnswer": { "@type": "Answer", "text": "If you cancel while only the advance has been paid, it's refunded in full to your original payment method within 3 business days (this doesn't apply if the project was treated as abandoned — see above)." }
        },
        {
          "@type": "Question",
          "name": "What if I cancel after final payment?",
          "acceptedAnswer": { "@type": "Answer", "text": "Once final payment is made or the site is delivered, payments are non-refundable by default. Refunds after this point are considered at BespokeDeploy's discretion — reach out and I'll hear you out." }
        },
        {
          "@type": "Question",
          "name": "Is hosting really free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, hosting on Cloudflare Pages or Netlify is ₹0/month forever. A custom domain is optional and paid directly by you to your registrar of choice." }
        }
      ]
    }
    </script>
